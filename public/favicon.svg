<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.12" flood-color="#F97316"/>
    </filter>
  </defs>

  <!-- Warm background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="#FFFDF9" />

  <!-- EAT List typography & mark -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="256" y="275" font-size="160" font-weight="900" fill="#F97316" letter-spacing="-4">EAT</text>
    <text x="340" y="340" font-size="82" font-weight="700" font-style="italic" fill="#FDBA74" stroke="#FFFDF9" stroke-width="6" paint-order="stroke fill" letter-spacing="-1">List</text>
  </g>
</svg>
